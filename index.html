<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games - Jeferson Araujo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e0e0e0;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{text-align:center;padding:3rem 1rem 1rem;width:100%}
header h1{font-size:2.5rem;color:#e94560;text-shadow:0 0 30px rgba(233,69,96,.3);margin-bottom:.5rem}
header p{color:#888;font-size:1.05rem}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;padding:2rem;max-width:1000px;width:100%}
.game-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:2rem 1.5rem;text-decoration:none;color:inherit;transition:all .3s;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.game-card:hover{border-color:#e94560;transform:translateY(-4px);box-shadow:0 10px 40px rgba(233,69,96,.15)}
.game-card .icon{font-size:3rem;margin-bottom:.3rem}
.game-card h2{font-size:1.2rem;color:#fff;text-align:center}
.game-card p{font-size:.9rem;color:#999;text-align:center;line-height:1.5}
.game-card .tag{display:inline-block;padding:.25rem .7rem;border-radius:20px;font-size:.75rem;font-weight:bold;text-transform:uppercase;letter-spacing:1px;margin-top:.3rem}
.tag-mobile{background:rgba(0,200,255,.15);color:#00c8ff}
.game-card .play-btn{padding:.5rem 2rem;border-radius:30px;background:#e94560;color:white;font-weight:bold;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;transition:all .3s;margin-top:.5rem}
.game-card:hover .play-btn{background:#ff6b81;box-shadow:0 0 20px rgba(233,69,96,.4)}
footer{padding:2rem;color:#555;font-size:.85rem;text-align:center}
@media(max-width:600px){header h1{font-size:1.8rem}.games-grid{padding:1rem;gap:1rem}}
</style>
</head>
<body>
<header>
  <h1>🎮 Games</h1>
  <p>Jogos web feitos por Jeferson Araujo 🤝 Manu</p>
</header>
<div class="games-grid">
  <a href="fuja-do-japa/" class="game-card">
    <div class="icon">🥋</div>
    <h2>Fuja do Japa</h2>
    <p>Arraste o alvo para fugir do japa! A cada 5s ele fica mais rápido.</p>
    <span class="tag tag-mobile">📱 Mobile</span>
    <div class="play-btn">▶ Jogar</div>
  </a>
</div>
<footer><p>Jeferson Araujo &bull; 2026</p></footer>
</body>
</html>
